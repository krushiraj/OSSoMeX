[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research"
version = "0.1.0"
description = "Software mention extraction study harness"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-playwright>=0.5,<1"]
interactive = ["prompt_toolkit==3.0.52"]
ml = [
    "torch>=2.6,<3",
    "transformers>=4.40,<5",
    "datasets>=2.19,<5",
    "numpy>=1.26,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"research.annotations" = ["web/*.html", "web/*.js", "web/*.css"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
