version: "0.8.0"

grobidHome: ../grobid-home

entityFishingHost: nerd.huma-num.fr/nerd/
entityFishingPort: 443
corpusPath: resources/dataset/
tmpPath: tmp/
pub2teiPath: "../../Pub2TEI/"
useBinaryContextClassifiers: true

models:
  - name: "software"
    engine: "delft"
    wapiti:
      epsilon: 0.00001
      window: 30
      nbMaxIterations: 1500
    delft:
      architecture: "BERT"
      transformer: "allenai/scibert_scivocab_cased"

  - name: "software-type"
    engine: "wapiti"
    wapiti:
      epsilon: 0.00001
      window: 30
      nbMaxIterations: 1500
    delft:
      architecture: "BERT_CRF"
      transformer: "michiyasunaga/LinkBERT-basecased"

  - name: "context"
    engine: "delft"
    delft:
      architecture: "bert"
      transformer: "michiyasunaga/LinkBERT-basecased"

  - name: "context_used"
    engine: "delft"
    delft:
      architecture: "bert"
      transformer: "michiyasunaga/LinkBERT-basecased"

  - name: "context_creation"
    engine: "delft"
    delft:
      architecture: "bert"
      transformer: "michiyasunaga/LinkBERT-basecased"

  - name: "context_shared"
    engine: "delft"
    delft:
      architecture: "bert"
      transformer: "michiyasunaga/LinkBERT-basecased"

maxParallelRequests: 0
corsAllowedOrigins: "*"
corsAllowedMethods: "OPTIONS,GET,PUT,POST,DELETE,HEAD"
corsAllowedHeaders: "X-Requested-With,Content-Type,Accept,Origin"

server:
  type: custom
  idleTimeout: 120 seconds
  applicationConnectors:
    - type: http
      port: 8060
  adminConnectors:
    - type: http
      port: 8061
  registerDefaultExceptionMappers: false
  maxThreads: 2048
  maxQueuedRequests: 2048
  acceptQueueSize: 2048
  requestLog:
    appenders: []

logging:
  level: INFO
  loggers:
    org.apache.pdfbox.pdmodel.font.PDSimpleFont: "OFF"
    org.glassfish.jersey.internal: "OFF"
    com.squarespace.jersey2.guice.JerseyGuiceUtils: "OFF"
  appenders:
    - type: console
      threshold: WARN
      timeZone: UTC
    - type: file
      currentLogFilename: logs/software-service.log
      threshold: INFO
      archive: true
      archivedLogFilenamePattern: logs/software-service-%d.log
      archivedFileCount: 7
      timeZone: UTC
